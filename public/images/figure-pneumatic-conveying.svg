<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t d">
  <title id="t">Pneumatic versus mechanical conveying — power per tonne</title>
  <desc id="d">Comparison diagram: a bucket elevator moving flour at low power, versus dilute-phase positive pressure pneumatic conveying at three to five times the power per tonne, with a filter receiver required to clean the air.</desc>
  <style>
    .h { font:700 13px/1 ui-sans-serif,system-ui,sans-serif; fill:#1b2836; }
    .s { font:400 11px/1.3 ui-sans-serif,system-ui,sans-serif; fill:#3c5b76; }
    .lbl { font:700 11px/1 ui-sans-serif,system-ui,sans-serif; fill:#c54808; letter-spacing:.08em; }
    .big { font:700 30px/1 ui-sans-serif,system-ui,sans-serif; }
    .ln { stroke:#7292ac; stroke-width:2; fill:none; }
    .cap { font:400 11px/1.4 ui-sans-serif,system-ui,sans-serif; fill:#4f7391; }
  </style>
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="28" y="30" class="lbl">MECHANICAL — BUCKET ELEVATOR</text>
  <text x="28" y="52" class="h" style="fill:#324960">1.0× reference power</text>

  <!-- elevator -->
  <rect x="28" y="70" width="60" height="170" rx="6" fill="#f4f6f8" stroke="#cbd7e2" stroke-width="1.5"/>
  <g fill="#4f7391">
    <rect x="40" y="84" width="36" height="14" rx="2"/>
    <rect x="40" y="112" width="36" height="14" rx="2"/>
    <rect x="40" y="140" width="36" height="14" rx="2"/>
    <rect x="40" y="168" width="36" height="14" rx="2"/>
    <rect x="40" y="196" width="36" height="14" rx="2"/>
    <rect x="40" y="224" width="36" height="14" rx="2"/>
  </g>
  <rect x="28" y="240" width="180" height="52" rx="6" fill="#1b2836"/>
  <text x="42" y="262" class="h" style="fill:#ffffff">Flour in</text>
  <text x="42" y="279" class="s" style="fill:#a3b8ca">from sifter throughs</text>
  <rect x="28" y="310" width="180" height="52" rx="6" fill="#fff8ed" stroke="#ff9c37" stroke-width="1.5"/>
  <text x="42" y="332" class="h">Flour out</text>
  <text x="42" y="349" class="s">to packing</text>
  <path class="ln" d="M118 240 V92" marker-end="url(#a3)"/>
  <path class="ln" d="M118 92 H196 V336 H214" marker-end="url(#a3)"/>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7292ac"/>
    </marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ee6107"/>
    </marker>
  </defs>
  <text x="28" y="392" class="cap">Vertical lift, no air, no filter receiver.</text>
  <text x="28" y="410" class="cap">Wears at the boot; needs headroom.</text>

  <line x1="290" y1="20" x2="290" y2="440" stroke="#e6ebf0" stroke-width="2"/>

  <text x="330" y="30" class="lbl">PNEUMATIC — DILUTE PHASE</text>
  <text x="330" y="52" class="h" style="fill:#c54808">3–5× the power per tonne</text>

  <!-- blower + pipe -->
  <rect x="330" y="240" width="150" height="52" rx="6" fill="#1b2836"/>
  <text x="344" y="262" class="h" style="fill:#ffffff">Blower</text>
  <text x="344" y="279" class="s" style="fill:#a3b8ca">15–25 m/s air</text>
  <rect x="330" y="70" width="150" height="52" rx="6" fill="#f4f6f8" stroke="#cbd7e2" stroke-width="1.5"/>
  <text x="344" y="92" class="h">Pick-up point</text>
  <text x="344" y="109" class="s">rotary valve feeds</text>
  <path class="ln" d="M480 266 H560 V96 H486" stroke="#ee6107" stroke-width="3" marker-end="url(#a4)"/>
  <circle cx="540" cy="180" r="3" fill="#ee6107"/>
  <circle cx="556" cy="140" r="3" fill="#ee6107"/>
  <circle cx="552" cy="220" r="3" fill="#ee6107"/>

  <!-- filter receiver -->
  <rect x="560" y="70" width="180" height="120" rx="6" fill="#fff8ed" stroke="#ee6107" stroke-width="2"/>
  <text x="574" y="94" class="h">Filter receiver</text>
  <text x="574" y="112" class="s">cloth bags or cartridges</text>
  <text x="574" y="130" class="s">air cleaned before return</text>
  <text x="574" y="148" class="s">flour drops to airlock</text>
  <g stroke="#ee6107" stroke-width="1.5" fill="none">
    <line x1="574" y1="160" x2="726" y2="160"/>
    <line x1="574" y1="172" x2="726" y2="172"/>
  </g>
  <rect x="560" y="214" width="180" height="52" rx="6" fill="#fff8ed" stroke="#ff9c37" stroke-width="1.5"/>
  <text x="574" y="236" class="h">Flour out</text>
  <text x="574" y="253" class="s">via airlock to packing</text>
  <path class="ln" d="M650 190 V208" marker-end="url(#a3)"/>

  <text x="330" y="330" class="h">Where it earns its power</text>
  <text x="330" y="352" class="cap">• Routing around obstructions and between floors</text>
  <text x="330" y="370" class="cap">• Multiple pick-up points into one receiver</text>
  <text x="330" y="388" class="cap">• Dust-free transfer at the pick-up and drop</text>
  <text x="330" y="406" class="cap">• Retrofit into an existing building with no headroom</text>

  <text x="760" y="330" class="h">Where it does not</text>
  <text x="760" y="352" class="cap">• Bulk transfer over long distance</text>
  <text x="760" y="370" class="cap">• Anything a bucket elevator can reach</text>
  <text x="760" y="388" class="cap">• Lines running clear "to be safe"</text>

  <text x="28" y="444" class="cap">Dense phase (3–8 m/s) is gentler on the product and needs 2–3× the pressure. Every pneumatic system needs a filter receiver — the air has to be cleaned somewhere.</text>
</svg>
