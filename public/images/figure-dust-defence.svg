<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
  <title id="t">Dust explosion — five elements and the layered defence</title>
  <desc id="d">Five required elements for a flour dust explosion — fuel, oxygen, ignition, dispersion, confinement — with the engineering controls that remove each, and a defence-in-depth ladder from prevention through venting to housekeeping.</desc>
  <style>
    .p { fill:#f4f6f8; stroke:#cbd7e2; stroke-width:1.5; }
    .kill { fill:#fff8ed; stroke:#ff9c37; stroke-width:1.5; }
    .h { font:700 12px/1 ui-sans-serif,system-ui,sans-serif; fill:#1b2836; }
    .s { font:400 10.5px/1.3 ui-sans-serif,system-ui,sans-serif; fill:#3c5b76; }
    .lbl { font:700 11px/1 ui-sans-serif,system-ui,sans-serif; fill:#c54808; letter-spacing:.08em; }
    .big { font:700 13px/1 ui-sans-serif,system-ui,sans-serif; fill:#ffffff; }
    .cap { font:400 11px/1.4 ui-sans-serif,system-ui,sans-serif; fill:#4f7391; }
  </style>
  <rect width="1000" height="470" fill="#ffffff"/>

  <text x="28" y="28" class="lbl">FIVE ELEMENTS — REMOVE ANY ONE AND THERE IS NO EXPLOSION</text>
  <line x1="28" y1="36" x2="972" y2="36" stroke="#e6ebf0"/>

  <!-- five elements -->
  <g><rect class="p" x="28" y="50" width="180" height="66" rx="7"/>
    <text class="h" x="42" y="72">Fuel</text>
    <text class="s" x="42" y="90">flour dust, 40–60 g/m³</text>
    <text class="s" x="42" y="105">minimum explosive conc.</text></g>
  <g><rect class="p" x="228" y="50" width="180" height="66" rx="7"/>
    <text class="h" x="242" y="72">Oxygen</text>
    <text class="s" x="242" y="90">present in any open building</text>
    <text class="s" x="242" y="105">inerting below 10–12%</text></g>
  <g><rect class="p" x="428" y="50" width="180" height="66" rx="7"/>
    <text class="h" x="442" y="72">Ignition</text>
    <text class="s" x="442" y="90">50–100 mJ for wheat flour</text>
    <text class="s" x="442" y="105">static, friction, hot surface</text></g>
  <g><rect class="p" x="628" y="50" width="180" height="66" rx="7"/>
    <text class="h" x="642" y="72">Dispersion</text>
    <text class="s" x="642" y="90">dust suspended as a cloud</text>
    <text class="s" x="642" y="105">not lying in a layer</text></g>
  <g><rect class="p" x="828" y="50" width="144" height="66" rx="7"/>
    <text class="h" x="842" y="72">Confinement</text>
    <text class="s" x="842" y="90">vessel, duct, filter</text>
    <text class="s" x="842" y="105">or a closed room</text></g>

  <!-- arrows down to controls -->
  <g stroke="#a3b8ca" stroke-width="1.5">
    <path d="M118 116 V136" marker-end="url(#a5)"/>
    <path d="M318 116 V136" marker-end="url(#a5)"/>
    <path d="M518 116 V136" marker-end="url(#a5)"/>
    <path d="M718 116 V136" marker-end="url(#a5)"/>
    <path d="M900 116 V136" marker-end="url(#a5)"/>
  </g>
  <defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#a3b8ca"/></marker></defs>

  <!-- controls -->
  <g><rect class="kill" x="28" y="140" width="180" height="78" rx="7"/>
    <text class="h" x="42" y="162">Remove the fuel</text>
    <text class="s" x="42" y="180">enclosed transfer points</text>
    <text class="s" x="42" y="195">local exhaust at every</text>
    <text class="s" x="42" y="209">dust generation point</text></g>
  <g><rect class="kill" x="228" y="140" width="180" height="78" rx="7"/>
    <text class="h" x="242" y="162">Remove the oxygen</text>
    <text class="s" x="242" y="180">nitrogen inerting on</text>
    <text class="s" x="242" y="195">grinding and conveying</text>
    <text class="s" x="242" y="209">(rare outside chemicals)</text></g>
  <g><rect class="kill" x="428" y="140" width="180" height="78" rx="7"/>
    <text class="h" x="442" y="162">Remove the ignition</text>
    <text class="s" x="442" y="180">bonding and earthing,</text>
    <text class="s" x="442" y="195">ATEX motors, magnets,</text>
    <text class="s" x="442" y="209">hot-work permit</text></g>
  <g><rect class="kill" x="628" y="140" width="180" height="78" rx="7"/>
    <text class="h" x="642" y="162">Prevent dispersion</text>
    <text class="s" x="642" y="180">no compressed-air</text>
    <text class="s" x="642" y="195">blow-down; vacuum or</text>
    <text class="s" x="642" y="209">wet methods instead</text></g>
  <g><rect class="kill" x="828" y="140" width="144" height="78" rx="7"/>
    <text class="h" x="842" y="162">Limit confinement</text>
    <text class="s" x="842" y="180">explosion venting,</text>
    <text class="s" x="842" y="195">flameless vents,</text>
    <text class="s" x="842" y="209">isolation valves</text></g>

  <!-- defence ladder -->
  <text x="28" y="262" class="lbl">DEFENCE IN DEPTH — IN ORDER OF EFFECTIVENESS</text>
  <line x1="28" y1="270" x2="972" y2="270" stroke="#e6ebf0"/>

  <rect x="28" y="284" width="944" height="34" rx="5" fill="#1b2836"/>
  <text x="44" y="306" class="big">1 · PREVENT</text>
  <text x="180" y="305" class="s" style="fill:#cbd7e2">Design out accumulation. No ledges, no dead legs, no horizontal surfaces the cleaning crew cannot reach.</text>

  <rect x="28" y="326" width="944" height="34" rx="5" fill="#324960"/>
  <text x="44" y="348" class="big">2 · DETECT</text>
  <text x="180" y="347" class="s" style="fill:#cbd7e2">Spark detection and extinguishing on ducts and collectors. Stops the spark before it reaches the filter.</text>

  <rect x="28" y="368" width="944" height="34" rx="5" fill="#4f7391"/>
  <text x="44" y="390" class="big">3 · ISOLATE</text>
  <text x="180" y="389" class="s" style="fill:#e6ebf0">Fast-acting valves on ducts. A primary event in one vessel must not propagate through the plant.</text>

  <rect x="28" y="410" width="944" height="34" rx="5" fill="#7292ac"/>
  <text x="44" y="432" class="big">4 · VENT</text>
  <text x="180" y="431" class="s" style="fill:#ffffff">Explosion venting to a safe outdoor area, sized to the vessel. Flameless vents where outdoor venting is impossible.</text>

  <text x="28" y="462" class="cap">Housekeeping is not step 5 — it is step 1. A 1 mm layer over 5% of the floor area is enough to destroy the building in a secondary event.</text>
</svg>
